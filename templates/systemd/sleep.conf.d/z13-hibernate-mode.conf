# Z13: hibernate powers off through S5 (like a normal shutdown) instead of the
# firmware's ACPI S4 entry. Platform (S4) power-off hung once after an s2idle
# cycle (2026-11-24): image written, power button dead, hard power-off needed.
# See docs/hibernation.md "Power-off hang (platform S4)". Deployed by Phase 25.
[Sleep]
HibernateMode=shutdown
