# Z13: closing the lid suspends, then hibernates after HibernateDelaySec
# (z13-hibernate-delay.conf), on battery and on AC. s2idle drained ~8-9%/h
# here, so a long closed-lid suspend could run the battery flat. Docked or
# with an external display, closing the lid does nothing. Deployed by Phase 26.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
HandleLidSwitchDocked=ignore
